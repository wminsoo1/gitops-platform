apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: members
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: member-a
            repo: https://github.com/wminsoo1/spring-error-app.git
            path: deploy
  template:
    metadata:
      name: "{{.name}}"
    spec:
      project: "{{.name}}"
      source:
        repoURL: "{{.repo}}"
        targetRevision: main
        path: "{{.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.name}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
