apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: members
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: member-a
            repo: https://github.com/wminsoo1/spring-error-app.git
            path: deploy/chart
            revision: main
            valueFile: values-prod.yaml   # 어느 서버 값으로 띄울지 (values-test / values-model / values-prod)
  template:
    metadata:
      name: "{{.name}}"
    spec:
      project: "{{.name}}"
      source:
        repoURL: "{{.repo}}"
        targetRevision: "{{.revision}}"
        path: "{{.path}}"
        helm:
          valueFiles:
            - "{{.valueFile}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.name}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
