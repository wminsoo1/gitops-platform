# Kyverno: Pod가 만들어질 때 이미지 서명을 검사한다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.2                  # Kyverno v1.19.2
    helm:
      valuesObject:
        features:
          registryClient:
            allowInsecure: true            # 실습 Harbor가 HTTP라 허용
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true               # CRD가 커서 필요
